name: Terragrunt Setup
description: >
  Installs Terraform and Terragrunt at pinned versions.
  Intentionally no plugin cache — infrastructure-live applies
  across multiple modules in sequence so per-module cache keys
  don't apply here. Cache lives in infrastructure-modules only.

inputs:
  terraform-version:
    description: 'Terraform version to install'
    required: false
    default: '1.7.5'
  terragrunt-version:
    description: 'Terragrunt version to install'
    required: false
    default: '0.84.1'

runs:
  using: composite
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Install Terragrunt
      shell: bash
      env:
        TERRAGRUNT_VERSION: ${{ inputs.terragrunt-version }}
      run: |
        set -euo pipefail
        curl -L -o terragrunt \
          "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
        chmod +x terragrunt
        sudo mv terragrunt /usr/local/bin/
        terragrunt --version