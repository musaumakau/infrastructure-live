name: Destroy Infra
on:
  workflow_dispatch:  # manual trigger from GitHub UI
permissions:
        id-token: write
        contents: read
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1 
      REPO_DISPATCH_PAT: ${{ secrets.REPO_DISPATCH_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649203810550:role/EksOIDCRole
          aws-region: eu-west-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: 1.7.5    
      - name: Install Terragrunt
        run: |
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.58.14/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/
      - name: Remove Terraform Lock Files
        run: |
          echo "Removing all .terraform.lock.hcl files..."
          find . -name ".terraform.lock.hcl" -type f -delete
          echo "Lock files removed successfully"
      - name: Destroy kubernetes-addons
        working-directory: Dev/kubernetes-addons
        run: terragrunt run-all destroy --terragrunt-non-interactive -auto-approve
      - name: Destroy EKS
        working-directory: Dev/eks
        run: terragrunt run-all destroy --terragrunt-non-interactive -auto-approve
      - name: Destroy VPC
        working-directory: Dev/vpc
        run: terragrunt run-all destroy --terragrunt-non-interactive -auto-approve
