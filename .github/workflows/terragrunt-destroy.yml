name: Destroy Infra

on:
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-1 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<account-id>:role/<your-cicd-role>
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terragrunt
        run: |
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.58.14/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Destroy kubernetes-addons
        working-directory: path/to/kubernetes-addons
        run: terragrunt run-all destroy -auto-approve

      - name: Destroy EKS
        working-directory: path/to/eks
        run: terragrunt run-all destroy -auto-approve

      - name: Destroy VPC
        working-directory: path/to/vpc
        run: terragrunt run-all destroy -auto-approve
