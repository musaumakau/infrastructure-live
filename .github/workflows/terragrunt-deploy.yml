# =============================================================================
# Terragrunt Deploy — infrastructure-live
# =============================================================================
#
# ENVIRONMENT PROMOTION MODEL (Pattern 2 — directory per environment):
#
#   infrastructure-modules merge to main
#     └─ auto-dispatch → Dev (always, no approval)
#
#   Dev deploy succeeds
#     └─ promote job fires repository_dispatch (trigger-staging) → Staging deploys
#
#   Staging deploy succeeds
#     └─ promote job fires repository_dispatch (trigger-prod) → Prod deploys
#
# TRIGGERS:
#   repository_dispatch  — fired by infrastructure-modules on merge to main
#                          always targets Dev
#   workflow_dispatch    — manual re-runs only
#                          also used for manual re-runs of a failed deploy
#
# NOTE: No push trigger — adding environment configs to main never triggers
#       a deploy. Only explicit dispatches do.
#
# REQUIRED SECRETS:
#   REPO_DISPATCH_PAT      — PAT for cross-repo PR creation and dispatch
#   GRAFANA_ADMIN_PASSWORD — passed through to kubernetes-addons
#
# REQUIRED VARIABLES:
#   PLAN_MANIFEST_BUCKET   — S3 bucket for plan manifests
# =============================================================================

name: Terragrunt Deploy

on:
  # trigger-deploy   — fired by infrastructure-modules on merge to main → Dev
  # trigger-staging  — fired by promote job after successful Dev deploy
  # trigger-prod     — fired by promote job after successful Staging deploy
  repository_dispatch:
    types: [trigger-deploy, trigger-staging, trigger-prod]

  # Manual re-run of a failed deploy
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (Dev / Staging / Prod)'
        required: true
        type: choice
        options: [Dev, Staging, Prod]
      sha:
        description: 'Commit SHA (leave blank to use HEAD)'
        required: false

# Never cancel an in-progress deploy — a cancelled apply leaves state partial
concurrency:
  group: "terragrunt-deploy-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

# =============================================================================
# JOB 1: Resolve target environment
# Determines which environment this run targets so every downstream job
# can scope itself correctly without duplicating the detection logic.
# =============================================================================
jobs:
  resolve-env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      sha:         ${{ steps.detect.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect environment
        id: detect
        run: |
          set -euo pipefail

          # workflow_dispatch — explicit input wins
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            SHA="${{ inputs.sha || github.sha }}"
            echo "Manual dispatch — environment: $ENV, sha: $SHA"

          # repository_dispatch — event action determines target environment
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ACTION="${{ github.event.action }}"
            SHA="${{ github.event.client_payload.sha }}"

            if [ "$ACTION" = "trigger-deploy" ]; then
              ENV="Dev"
            elif [ "$ACTION" = "trigger-staging" ]; then
              ENV="Staging"
            elif [ "$ACTION" = "trigger-prod" ]; then
              ENV="Prod"
            else
              echo "ERROR: unknown dispatch action: $ACTION"
              exit 1
            fi

            echo "Repository dispatch — action: $ACTION, environment: $ENV, sha: $SHA"

          # fallback — should not be reached with current triggers
          else
            echo "ERROR: unexpected event type ${{ github.event_name }}"
            exit 1
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "sha=$SHA"         >> $GITHUB_OUTPUT

# =============================================================================
# JOB 2: Plan Comparison Gate (matrix: vpc, eks)
# Re-plans each module and compares against the S3 manifest saved at PR time.
#
# Phase 1: checks resource addresses + actions (original gate)
# Phase 2: checks critical property drift for fingerprinted resource types
#          aws_security_group, aws_iam_role, aws_s3_bucket
#          Skipped automatically for v1 manifests (no fingerprints) so
#          rollout is safe — existing deploys are unaffected.
#
# ENV thresholds:
#   Dev     → warn only, never blocks (observe + calibrate)
#   Staging → block on drift score >= 70
#   Prod    → block on drift score >= 40
# =============================================================================
  gate:
    name: "Plan Comparison Gate [${{ matrix.module }}]"
    runs-on: ubuntu-latest
    needs: resolve-env
    if: needs.resolve-env.outputs.environment != 'none'
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read

    outputs:
      needs_approval: ${{ steps.compare.outputs.needs_approval }}
      reason:         ${{ steps.compare.outputs.reason }}
      max_drift_score: ${{ steps.compare.outputs.max_drift_score }}

    strategy:
      matrix:
        module: [vpc, eks]
        # kubernetes-addons excluded — depends on live cluster
      fail-fast: false

    env:
      TARGET_ENV: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::649203810550:role/EksOIDCRole
          aws-region:        eu-west-1
          role-session-name: "github-actions-gate-${{ github.run_id }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          TERRAGRUNT_VERSION="0.84.1"
          curl -L -o terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64
          chmod +x terragrunt && sudo mv terragrunt /usr/local/bin/

      - name: Fetch manifest from S3
        id: fetch
        run: |
          set -euo pipefail
          SHA="${{ needs.resolve-env.outputs.sha }}"

          if [ -z "$SHA" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No SHA — skipping manifest fetch"
            exit 0
          fi

          KEY="deploy-pointer/${SHA}/${{ matrix.module }}/manifest.json"
          aws s3 cp s3://${{ vars.PLAN_MANIFEST_BUCKET }}/${KEY} pr-manifest.json \
            && echo "found=true" >> $GITHUB_OUTPUT \
            || echo "found=false" >> $GITHUB_OUTPUT

      - name: Re-plan
        id: replan
        env:
          REPO_DISPATCH_PAT:      ${{ secrets.REPO_DISPATCH_PAT }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          cd ${{ env.TARGET_ENV }}/${{ matrix.module }}
          terragrunt init --upgrade
          terragrunt plan --non-interactive -out=tfplan.binary

          CACHE_DIR=$(find .terragrunt-cache -name "tfplan.binary" -printf '%h\n' | head -1)
          if [ -z "$CACHE_DIR" ]; then
            echo "ERROR: could not find tfplan.binary under .terragrunt-cache"
            exit 1
          fi

          terraform -chdir="$CACHE_DIR" show -json tfplan.binary > tfplan-deploy.json
          cp tfplan-deploy.json $GITHUB_WORKSPACE/tfplan-deploy.json

      - name: Compare plans
        id: compare
        env:
          TARGET_ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          set -euo pipefail
          
          if [ "${{ steps.fetch.outputs.found }}" != "true" ]; then
            echo "needs_approval=false" >> $GITHUB_OUTPUT
            echo "reason=No manifest for this module — not changed in PR, skipping" >> $GITHUB_OUTPUT
            echo "max_drift_score=0"    >> $GITHUB_OUTPUT
            echo "drift_findings=[]"    >> $GITHUB_OUTPUT
            exit 0
          fi


          python3 << 'EOF'
          import json, os

          # ---------------------------------------------------------------
          # Drift severity thresholds per environment.
          # fail_on: drift score >= this blocks the deploy
          # warn_on: drift score >= this warns but allows proceed
          # Dev is warn-only so you can observe scoring before it gates prod.
          # ---------------------------------------------------------------
          ENV_POLICY = {
              'Dev':     {'fail_on': 999, 'warn_on': 30},
              'Staging': {'fail_on': 70,  'warn_on': 30},
              'Prod':    {'fail_on': 40,  'warn_on': 20},
          }

          # Severity score per property — how dangerous is drift here?
          PROPERTY_SEVERITY = {
              'ingress':                              80,
              'egress':                               60,
              'assume_role_policy':                   90,
              'managed_policy_arns':                  85,
              'inline_policy':                        85,
              'permissions_boundary':                 70,
              'max_session_duration':                 30,
              'public_access_block':                  95,
              'server_side_encryption_configuration': 90,
              'versioning':                           50,
              'bucket_policy':                        85,
          }

          # Properties to fingerprint per resource type.
          # capture: extract and compare these
          # ignore:  volatile fields — tags, ARNs, timestamps, computed IDs
          FINGERPRINT_SCHEMA = {
              'aws_security_group': {
                  'capture': ['ingress', 'egress'],
                  'ignore':  ['tags', 'tags_all', 'description', 'name',
                              'timeouts', 'id', 'arn'],
              },
              'aws_iam_role': {
                  'capture': ['assume_role_policy', 'managed_policy_arns',
                              'inline_policy', 'permissions_boundary',
                              'max_session_duration'],
                  'ignore':  ['tags', 'tags_all', 'description', 'name',
                              'path', 'id', 'arn', 'unique_id', 'create_date'],
              },
              'aws_s3_bucket': {
                  'capture': ['bucket_policy',
                              'server_side_encryption_configuration',
                              'versioning', 'public_access_block'],
                  'ignore':  ['tags', 'tags_all', 'bucket', 'id', 'arn',
                              'hosted_zone_id', 'region', 'bucket_domain_name',
                              'bucket_regional_domain_name', 'website_endpoint'],
              },
          }

          def normalize(value):
              """
              Canonical form for comparison.
              Sorts dict keys and list-of-dicts so ordering differences
              in ingress/egress rules don't cause false alarms.
              Must stay identical to the normalize() in the manifest writer.
              """
              if isinstance(value, dict):
                  return {k: normalize(v) for k, v in sorted(value.items())}
              if isinstance(value, list):
                  normalized = [normalize(i) for i in value]
                  try:
                      return sorted(normalized,
                                    key=lambda x: json.dumps(x, sort_keys=True))
                  except TypeError:
                      return normalized
              if isinstance(value, str):
                  return value.strip()
              return value

          def diff_fingerprints(pr_fp, deploy_fp):
              """
              Compare two fingerprints property by property.
              Skips properties missing from deploy_fp — those were
              after_unknown at deploy time and can't be compared.
              """
              findings = []
              for prop, pr_val in pr_fp.items():
                  if prop not in deploy_fp:
                      continue
                  deploy_val = deploy_fp[prop]
                  if pr_val != deploy_val:
                      findings.append({
                          'property':     prop,
                          'severity':     PROPERTY_SEVERITY.get(prop, 10),
                          'pr_value':     pr_val,
                          'deploy_value': deploy_val,
                      })
              return findings

          # ---------------------------------------------------------------
          # Load manifests
          # ---------------------------------------------------------------
          with open('pr-manifest.json') as f:
              pr = json.load(f)

          with open(os.environ['GITHUB_WORKSPACE'] + '/tfplan-deploy.json') as f:
              deploy_plan = json.load(f)

          environment = os.environ.get('TARGET_ENV', 'Prod')
          policy      = ENV_POLICY.get(environment, ENV_POLICY['Prod'])
          manifest_v  = pr.get('manifest_version', 1)

          # ---------------------------------------------------------------
          # Phase 1 — address + action surprises (original gate, unchanged)
          # ---------------------------------------------------------------
          pr_resources = {r['address']: r['actions'] for r in pr['resources']}

          deploy_resources = {
              r['address']: r['change']['actions']
              for r in deploy_plan.get('resource_changes', [])
              if r['change']['actions'] != ['no-op']
          }

          surprises = {
              addr: actions
              for addr, actions in deploy_resources.items()
              if addr not in pr_resources
          }

          # ---------------------------------------------------------------
          # Phase 2 — semantic property drift
          # Skipped if manifest_version < 2 (no fingerprints available).
          # Safe rollout: old manifests in S3 pass through unchanged.
          # ---------------------------------------------------------------
          drift_findings  = []
          max_drift_score = 0

          if manifest_v >= 2:
              pr_fingerprints = {
                  r['address']: r.get('fingerprint')
                  for r in pr['resources']
                  if r.get('fingerprint')
              }

              for r in deploy_plan.get('resource_changes', []):
                  if r['change']['actions'] == ['no-op']:
                      continue

                  addr   = r['address']
                  rtype  = r['type']
                  schema = FINGERPRINT_SCHEMA.get(rtype)
                  pr_fp  = pr_fingerprints.get(addr)

                  if not schema or not pr_fp:
                      continue

                  after_values  = r['change'].get('after') or {}
                  after_unknown = r['change'].get('after_unknown') or {}
                  unknown_keys  = (
                      {k for k, v in after_unknown.items() if v is True}
                      if isinstance(after_unknown, dict) else set()
                  )

                  deploy_fp = {
                      prop: normalize(after_values[prop])
                      for prop in schema['capture']
                      if prop not in unknown_keys and prop in after_values
                  }

                  for finding in diff_fingerprints(pr_fp, deploy_fp):
                      drift_findings.append({
                          'address':      addr,
                          'property':     finding['property'],
                          'severity':     finding['severity'],
                          'pr_value':     finding['pr_value'],
                          'deploy_value': finding['deploy_value'],
                      })
                      if finding['severity'] > max_drift_score:
                          max_drift_score = finding['severity']

          # ---------------------------------------------------------------
          # Gate decision
          # ---------------------------------------------------------------
          phase1_fail = bool(surprises)
          phase2_fail = max_drift_score >= policy['fail_on']
          phase2_warn = max_drift_score >= policy['warn_on'] and not phase2_fail

          needs_approval = phase1_fail or phase2_fail

          reasons = []
          if phase1_fail:
              reasons.append(
                  f"Phase 1 — {len(surprises)} unreviewed resource(s): "
                  f"{list(surprises.keys())}"
              )
          if phase2_fail:
              high = [f for f in drift_findings
                      if f['severity'] >= policy['fail_on']]
              reasons.append(
                  f"Phase 2 — critical property drift (max score "
                  f"{max_drift_score}, threshold {policy['fail_on']}) in: "
                  f"{list({f['address'] for f in high})}"
              )
          if phase2_warn and not needs_approval:
              reasons.append(
                  f"Phase 2 — property drift (max score {max_drift_score}, "
                  f"warn threshold {policy['warn_on']}) — allowed in {environment}"
              )
          if not reasons:
              reasons.append("All resources and properties match PR plan")

          reason = " | ".join(reasons)

          # ---------------------------------------------------------------
          # Outputs
          # ---------------------------------------------------------------
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              gh.write(f"needs_approval={'true' if needs_approval else 'false'}\n")
              gh.write(f"reason={reason}\n")
              gh.write(f"max_drift_score={max_drift_score}\n")
              gh.write(f"drift_findings={json.dumps(drift_findings)}\n")

          # Console output visible in the GHA log
          print(f"\n{'='*60}")
          print(f"GATE RESULT — {environment} / manifest v{manifest_v}")
          print(f"{'='*60}")
          print(f"Phase 1 (address check):  {'FAIL' if phase1_fail else 'PASS'}")
          if manifest_v >= 2:
              status = 'FAIL' if phase2_fail else 'WARN' if phase2_warn else 'PASS'
              print(f"Phase 2 (property drift): {status}")
              print(f"  Max drift score: {max_drift_score} "
                    f"(fail>={policy['fail_on']}, warn>={policy['warn_on']})")
              if drift_findings:
                  print(f"\n  Drift findings ({len(drift_findings)}):")
                  for f in sorted(drift_findings, key=lambda x: -x['severity']):
                      print(f"  [{f['severity']:>3}] {f['address']} → {f['property']}")
              else:
                  print("  No property drift detected")
          else:
              print("Phase 2 (property drift): SKIPPED — v1 manifest")
              print("  Next PR onwards will include fingerprints")
          print(f"\nDecision: {'BLOCK' if needs_approval else 'AUTO-APPROVE'}")
          print(f"Reason:   {reason}")
          print('='*60)
          EOF

      - name: Log gate result
        run: |
          echo "Environment:     ${{ env.TARGET_ENV }}"
          echo "Module:          ${{ matrix.module }}"
          echo "Needs approval:  ${{ steps.compare.outputs.needs_approval }}"
          echo "Max drift score: ${{ steps.compare.outputs.max_drift_score }}"
          echo "Reason:          ${{ steps.compare.outputs.reason }}"

      - name: Enforce gate decision
        run: |
          if [ "${{ steps.compare.outputs.needs_approval }}" = "true" ]; then
            echo "::error::Gate blocked deploy for module ${{ matrix.module }}"
            echo "::error::${{ steps.compare.outputs.reason }}"
            exit 1
          fi
          echo "Gate passed — proceeding to deploy"

# =============================================================================
# JOB 3: Deploy
# Applies vpc → eks → kubernetes-addons in order for the detected environment.
# =============================================================================
  deploy:
    name: "Deploy [${{ needs.resolve-env.outputs.environment }}]"
    runs-on: ubuntu-latest
    needs: [resolve-env, gate]
    if: always() && !failure() && !cancelled() && needs.resolve-env.outputs.environment != 'none'
    timeout-minutes: 60

    permissions:
      id-token: write
      contents: read

    env:
      TARGET_ENV:        ${{ needs.resolve-env.outputs.environment }}
      REPO_DISPATCH_PAT: ${{ secrets.REPO_DISPATCH_PAT }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::649203810550:role/EksOIDCRole
          aws-region:        eu-west-1
          role-session-name: "github-actions-deploy-${{ github.run_id }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          TERRAGRUNT_VERSION="0.84.1"
          curl -L -o terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64
          chmod +x terragrunt && sudo mv terragrunt /usr/local/bin/
          terragrunt --version

      - name: Format Check
        run: terragrunt hcl format --check --diff ${{ env.TARGET_ENV }} || true

      - name: Init all modules
        run: |
          set -euo pipefail
          for MODULE in vpc eks kubernetes-addons; do
            echo "── init ${{ env.TARGET_ENV }}/$MODULE ──"
            (cd ${{ env.TARGET_ENV }}/$MODULE && terragrunt init --upgrade)
          done

      - name: Validate all modules
        run: |
          set -euo pipefail
          for MODULE in vpc eks; do
            echo "── validate ${{ env.TARGET_ENV }}/$MODULE ──"
            (cd ${{ env.TARGET_ENV }}/$MODULE && terragrunt validate)
          done

      - name: Apply VPC
        run: |
          set -euo pipefail
          cd ${{ env.TARGET_ENV }}/vpc
          terragrunt apply --non-interactive --auto-approve

      - name: Apply EKS
        run: |
          set -euo pipefail
          cd ${{ env.TARGET_ENV }}/eks
          terragrunt apply --non-interactive --auto-approve

      - name: Configure Kubeconfig
        run: |
          set -euo pipefail
          CLUSTER_NAME=$(cd ${{ env.TARGET_ENV }}/eks && terragrunt output -raw eks_name)
          echo "Cluster: $CLUSTER_NAME"
          rm -f ~/.kube/config
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region eu-west-1
          sleep 5
          kubectl auth can-i get nodes
          kubectl get nodes

      - name: Apply Kubernetes Addons
        run: |
          set -euo pipefail
          cd ${{ env.TARGET_ENV }}/kubernetes-addons
          terragrunt apply --non-interactive --auto-approve
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

# =============================================================================
# JOB 4: Promote to next environment
# After a successful deploy, triggers the next environment.
#   Dev     → fires repository_dispatch trigger-staging
#   Staging → fires repository_dispatch trigger-prod
#   Prod    → no-op (end of pipeline)
#
# Using repository_dispatch instead of a push trigger means adding new
# environment configs to main never accidentally triggers a deploy.
# =============================================================================
  promote:
    name: Promote to next environment
    runs-on: ubuntu-latest
    needs: [resolve-env, deploy]
    if: |
      needs.deploy.result == 'success' &&
      (needs.resolve-env.outputs.environment == 'Dev' ||
       needs.resolve-env.outputs.environment == 'Staging')

    permissions:
      contents: read

    env:
      TARGET_ENV: ${{ needs.resolve-env.outputs.environment }}
      GH_TOKEN:   ${{ secrets.REPO_DISPATCH_PAT }}

    steps:
      - name: Resolve next environment
        id: next
        run: |
          if [ "${{ env.TARGET_ENV }}" = "Dev" ]; then
            echo "env=Staging" >> $GITHUB_OUTPUT
          else
            echo "env=Prod" >> $GITHUB_OUTPUT
          fi

      - name: Trigger next environment deploy
        run: |
          set -euo pipefail
          NEXT="${{ steps.next.outputs.env }}"
          SHA="${{ needs.resolve-env.outputs.sha }}"
          NEXT_EVENT="trigger-${NEXT,,}"  # trigger-staging or trigger-prod

          echo "Promoting ${{ env.TARGET_ENV }} → $NEXT (event: $NEXT_EVENT, sha: $SHA)"

          PAYLOAD=$(cat <<EOF
          {
            "event_type": "${NEXT_EVENT}",
            "client_payload": {
              "sha": "${SHA}"
            }
          }
          EOF
          )

          HTTP_STATUS=$(curl -s -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/musaumakau/infrastructure-live/dispatches \
            -d "$PAYLOAD")

          cat /tmp/dispatch-response.json || true

          if [ "$HTTP_STATUS" != "204" ]; then
            echo "ERROR: repository_dispatch failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "::notice::Triggered ${NEXT} deploy via repository_dispatch (SHA: $SHA)"